# NEXORA frontend only. Public read-only MEXC Spot endpoints, no keys or trading APIs.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/nexora-deploy/nexora-frontend/current;
    index index.html;

    location = /mexc-public/api/v3/exchangeInfo {
        limit_except GET { deny all; }
        proxy_ssl_server_name on;
        proxy_set_header Host api.mexc.com;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
        proxy_pass https://api.mexc.com/api/v3/exchangeInfo;
    }

    location = /mexc-public/api/v3/ticker/price {
        limit_except GET { deny all; }
        proxy_ssl_server_name on;
        proxy_set_header Host api.mexc.com;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
        proxy_pass https://api.mexc.com/api/v3/ticker/price;
    }

    location = /mexc-public/api/v3/ticker/24hr {
        limit_except GET { deny all; }
        proxy_ssl_server_name on;
        proxy_set_header Host api.mexc.com;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
        proxy_pass https://api.mexc.com/api/v3/ticker/24hr;
    }

    # Read-only public aggregate trades for sampled Trading Data.
    location = /mexc-public/api/v3/aggTrades {
        limit_except GET { deny all; }
        proxy_ssl_server_name on;
        proxy_set_header Host api.mexc.com;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
        proxy_pass https://api.mexc.com/api/v3/aggTrades;
    }

    location = /mexc-public/api/v3/depth {
        limit_except GET { deny all; }
        proxy_ssl_server_name on;
        proxy_set_header Host api.mexc.com;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
        proxy_pass https://api.mexc.com/api/v3/depth;
    }

    location = /mexc-public/api/v3/klines {
        limit_except GET { deny all; }
        proxy_ssl_server_name on;
        proxy_set_header Host api.mexc.com;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
        proxy_pass https://api.mexc.com/api/v3/klines;
    }

    location ^~ /mexc-public/ { return 404; }

    # CoinGecko read-only token metadata. The Demo key is configured locally
    # in /etc/nginx/snippets/nexora-coingecko-key.conf, not committed to GitHub.
    location ~ ^/coingecko-public/api/v3/coins/([a-z0-9-]+)$ {
        limit_except GET { deny all; }
        proxy_ssl_server_name on;
        proxy_set_header Host api.coingecko.com;
        include /etc/nginx/snippets/nexora-coingecko-key.conf;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
        rewrite ^/coingecko-public(/api/v3/coins/[a-z0-9-]+)$ $1 break;
        proxy_pass https://api.coingecko.com;
        add_header Cache-Control "private, max-age=3600" always;
    }
    # Read-only paginated CoinGecko icons for the Spot symbol selector.
    location = /coingecko-public/api/v3/coins/markets {
        limit_except GET { deny all; }
        proxy_ssl_server_name on;
        proxy_set_header Host api.coingecko.com;
        include /etc/nginx/snippets/nexora-coingecko-key.conf;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
        proxy_pass https://api.coingecko.com/api/v3/coins/markets;
    }
    location /coingecko-public/ { return 404; }

    # Persistent static token metadata; unaffected by frontend release switches.
    location ^~ /token-assets/ {
        alias /home/nexora-deploy/nexora-frontend/data/token-assets/;
        limit_except GET { deny all; }
        autoindex off;
        add_header Cache-Control "public, max-age=86400" always;
        types {
            application/json json;
            image/png png;
            image/webp webp;
        }
        default_type application/octet-stream;
    }

    location / { try_files $uri $uri/ /index.html; }

    location ~ /[.] { deny all; }
}
