<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA Spot</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0d0d;color:#e5e9f1;font:14px system-ui,Arial,sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 20px;background:#14161c;border-bottom:1px solid #30343e}
.brand{font-weight:800;letter-spacing:.1em;color:#5865f2;margin-right:10px}a{color:#9eabff;text-decoration:none}
label{font-size:12px;color:#aeb6c7}input,select,button{background:#20242d;border:1px solid #343b4a;border-radius:5px;color:#f4f6fa;padding:8px 10px;font:inherit}
input{width:155px;text-transform:uppercase}button{cursor:pointer}button:hover{border-color:#5865f2}button.active{background:#5865f2;border-color:#5865f2}
.container{padding:14px 18px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.bar small{margin-left:auto;color:#8994a7}
#chart{width:100%;height:min(70vh,740px);min-height:420px;border:1px solid #2a303c;background:#0d0d0d}
#status{min-height:24px;margin:9px 0;color:#93a1b7;font-size:12px}#status.error{color:#f05a70}
.info{max-width:1000px;color:#8c96a8;font-size:12px;line-height:1.7}
@media(max-width:600px){header{padding:10px}.container{padding:8px}#chart{min-height:360px;height:65vh}}

.market-row{display:flex;gap:9px;align-items:center;color:#aab4c4;margin-bottom:6px;padding:8px 4px}
.market-row span{font-size:12px;color:#7f899b}.chart-toolbar{background:#16191f;padding:7px;border:1px solid #282d38;border-radius:3px;gap:4px}
.period-buttons{display:flex;align-items:center;gap:3px}.chart-toolbar button{background:transparent;border-color:transparent;color:#9aa6ba;font-size:12px;padding:6px 9px}
.chart-toolbar button.active{background:#2e3443;color:#fff}.chart-toolbar button:disabled{opacity:.45;cursor:default}
.separator{height:24px;border-left:1px solid #363b45;margin:0 7px}.chart-mode{display:flex;gap:0;margin-left:auto;background:#20242d;padding:2px;border-radius:4px}
.chart-mode button.active{background:#343c4e}.chart-toolbar button:hover{background:#252b36}
@media(max-width:780px){.chart-toolbar{overflow-x:auto;flex-wrap:nowrap}.chart-toolbar button{white-space:nowrap}.chart-mode{margin-left:15px}}
body.embedded header,body.embedded .market-row,body.embedded .container>.info{display:none!important}
body.embedded .container{padding:0;margin:0;height:100vh;display:flex;flex-direction:column}
body.embedded .chart-toolbar{margin:0;border-left:0;border-right:0;border-top:0;border-radius:0;flex:0 0 auto}
body.embedded #chart{flex:1;min-height:180px;height:auto;border:0;width:100%}
body.embedded #status{margin:0;padding:3px 10px;min-height:17px;font-size:10px}
body.embedded{overflow:hidden}
</style></head><body>
<header><strong class="brand">NEXORA</strong><strong>Spot Chart</strong><span>·</span><span>NEXORA Spot</span><a href="/" style="margin-left:auto">Back to NEXORA Spot</a></header>
<main class="container">
<div class="market-row"><label for="symbol">Market</label><input id="symbol" value="BTCUSDT" maxlength="30" spellcheck="false" autocomplete="off"><button id="load">Load</button><span>NEXORA Spot</span></div>
<div class="bar chart-toolbar">
<div class="period-buttons" id="period-buttons"><button data-period="1m">1m</button><button data-period="5m">5m</button><button data-period="15m" class="active">15m</button><button data-period="30m">30m</button><button data-period="60m">1H</button><button data-period="4h">4H</button><button data-period="1d">1D</button></div>
<div class="separator"></div><button id="ma" class="active" title="MA 5 / 10 / 20">MA</button><button id="ema" title="EMA">EMA</button>
<button id="volume" class="active" title="Volume pane">VOL</button><button id="macd" title="MACD">MACD</button>
<button id="rsi" title="RSI">RSI</button><button id="boll" title="Bollinger Bands">BOLL</button>
<button id="trend" title="Draw trend segment">╱</button><button id="reset" title="Scroll to latest candles">⟳</button>
<div class="chart-mode"><button class="active">NEXORA</button><button disabled title="Future mode">Advanced</button><button disabled title="Future mode">Depth</button></div>
</div>
<div id="status" role="status">NEXORA</div><div id="chart" aria-label="Interactive cryptocurrency chart"></div>
<p class="info">NEXORA Spot chart · public market data only.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/klinecharts@10.1.0/dist/umd/klinecharts.min.js" crossorigin="anonymous"></script>
<script>
(()=>{
 const el=id=>document.getElementById(id);
 const status=(message,error=false)=>{el('status').textContent=message;el('status').classList.toggle('error',error)};
 const embedded = new URLSearchParams(location.search).get('embedded') === '1';
 if(embedded)document.body.classList.add('embedded');
 const lib=window.klinecharts;
 if(!lib?.init){status('NEXORA · Chart temporarily unavailable',true);return}
 let chart;
 try{chart=lib.init('chart',{locale:'en-US',timezone:'UTC',styles:'dark',layout:{yAxis:{position:'right'},barSpaceLimit:{min:3,max:38}}})}
 catch(error){status('NEXORA · Chart initialization failed',true);return}
 if(!chart){status('NEXORA · Chart unavailable',true);return}
 const PERIODS={'1m':{span:1,type:'minute'},'5m':{span:5,type:'minute'},'15m':{span:15,type:'minute'},'30m':{span:30,type:'minute'},'60m':{span:1,type:'hour'},'4h':{span:4,type:'hour'},'1d':{span:1,type:'day'}};
 const params=new URLSearchParams(location.search);
 const initialSymbol=(params.get('symbol')||'BTCUSDT').toUpperCase();
 let symbol=/^[A-Z0-9]{3,30}$/.test(initialSymbol)?initialSymbol:'BTCUSDT',period='15m',generation=0;
 el('symbol').value=symbol;
 const active=new Map(),ids={};
 const indicator=(key,name,options,paneId,stack)=>{
  try{
   if(active.has(key)){
    const id=active.get(key);if(id)chart.removeIndicator({id});
    active.delete(key);el(key).classList.remove('active');return;
   }
   const cfg={name,...(options||{}),...(paneId?{paneId}:{})};
   const id=chart.createIndicator(cfg,stack===true);
   if(!id)throw Error(name+' could not be created');
   active.set(key,id);el(key).classList.add('active');
  }catch(error){status('NEXORA · Indicator unavailable: '+name,true)}
 };
 function configureIndicators(){
  indicator('ma','MA',{calcParams:[5,10,20]},'candle_pane',true);
  indicator('volume','VOL',{calcParams:[5,10,20]},'volume_pane',false);
  try{chart.setPaneOptions?.({id:'volume_pane',height:130})}catch{}
 }
 function loadMarket(){
  const value=el('symbol').value.trim().toUpperCase();
  if(!/^[A-Z0-9]{3,30}$/.test(value)){status('NEXORA · Invalid market symbol',true);return}
  symbol=value;generation++;
  status('NEXORA');
  try{chart.setSymbol({ticker:symbol,pricePrecision:symbol.startsWith('BTC')?2:8,volumePrecision:2});chart.setPeriod(PERIODS[period]);chart.resetData?.()}
  catch(error){status('NEXORA · Market unavailable',true)}
 }
 try{
  // KLineChart v10 requires symbol + period to be set before data-loader initialization.
  chart.setSymbol({ticker:symbol,pricePrecision:2,volumePrecision:2});
  chart.setPeriod(PERIODS[period]);
  chart.setDataLoader({getBars:async({type,timestamp,callback})=>{
   const requestedSymbol=symbol,requestedPeriod=period,run=generation;
   try{
    const params=new URLSearchParams({symbol:requestedSymbol,interval:requestedPeriod,limit:'500'});
    if(type==='forward'&&typeof timestamp==='number')params.set('endTime',String(timestamp-1));
    const response=await fetch('/mexc-public/api/v3/klines?'+params,{credentials:'omit',cache:'no-store'});
    if(!response.ok)throw Error('HTTP '+response.status);
    const data=await response.json();if(!Array.isArray(data))throw Error('Unexpected candle payload');
    const bars=data.filter(r=>Array.isArray(r)&&r.length>=6).map(r=>({
     timestamp:Number(r[0]),open:Number(r[1]),high:Number(r[2]),low:Number(r[3]),close:Number(r[4]),volume:Number(r[5])
    })).filter(b=>Object.values(b).every(Number.isFinite)&&b.timestamp>0&&b.low>0&&b.high>=b.low)
     .sort((a,b)=>a.timestamp-b.timestamp).filter((b,i,arr)=>i===0||b.timestamp!==arr[i-1].timestamp);
    if(run!==generation)return callback([],{forward:false,backward:false});
    callback(bars,{forward:type==='forward'&&bars.length>=500,backward:false});
    status('NEXORA');
   }catch(error){callback([],{forward:false,backward:false});if(run===generation)status('NEXORA · Market data unavailable',true)}
  }});
  configureIndicators();
 }catch(error){status('NEXORA · Chart setup unavailable',true)}
 window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==window.parent||!event.data||event.data.type!=='nexora:chart-market')return;
  const next=String(event.data.symbol||'').toUpperCase();
  if(!/^[A-Z0-9]{3,30}$/.test(next)||next===symbol)return;
  el('symbol').value=next;loadMarket();
 });
 el('load').addEventListener('click',loadMarket);
 el('symbol').addEventListener('keydown',e=>{if(e.key==='Enter')loadMarket()});
 for(const button of el('period-buttons').querySelectorAll('button[data-period]')){
  button.addEventListener('click',()=>{
   period=button.dataset.period;for(const other of el('period-buttons').querySelectorAll('button'))other.classList.toggle('active',other===button);
   generation++;try{chart.setPeriod(PERIODS[period]);chart.resetData?.();status('NEXORA')}catch(error){status('NEXORA · Chart action unavailable',true)}
  });
 }
 el('ma').addEventListener('click',()=>indicator('ma','MA',{calcParams:[5,10,20]},'candle_pane',true));
 el('ema').addEventListener('click',()=>indicator('ema','EMA',{calcParams:[5,10,20]},'candle_pane',true));
 el('volume').addEventListener('click',()=>indicator('volume','VOL',{calcParams:[5,10,20]},'volume_pane',false));
 el('macd').addEventListener('click',()=>indicator('macd','MACD',{},'macd_pane',false));
 el('rsi').addEventListener('click',()=>indicator('rsi','RSI',{},'rsi_pane',false));
 el('boll').addEventListener('click',()=>indicator('boll','BOLL',{},'candle_pane',true));
 el('trend').addEventListener('click',()=>{try{chart.createOverlay('segment');status('NEXORA')}catch(error){status(error.message,true)}});
 el('reset').addEventListener('click',()=>chart.scrollToRealTime?.());
 const observer=new ResizeObserver(()=>chart.resize());observer.observe(el('chart'));
 window.addEventListener('pagehide',()=>{observer.disconnect();lib.dispose?.('chart')},{once:true});
})();
</script></body></html>
