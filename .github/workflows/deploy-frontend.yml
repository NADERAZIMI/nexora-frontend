name: NEXORA Frontend — static reference deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexora-frontend-turkey
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve chart dependencies with exact pinned versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Restore locally cached token logos
        uses: actions/cache@v4
        with:
          path: public/token-icons/
          key: nexora-public-spot-icons-v2
      - name: Download missing token logos for same-origin delivery
        run: python3 scripts/build-token-icons.py
      - run: npm run build
      - name: Include catalog generator for Turkey VPS
        run: |
          mkdir -p dist/build-tools
          cp scripts/build-spot-catalog.py dist/build-tools/build-spot-catalog.py
          cp scripts/build-kline-cache.py dist/build-tools/build-kline-cache.py
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-frontend-dist
          path: dist/
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: turkey-frontend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexora-frontend-dist
          path: dist/
      - name: Verify SSH configuration
        env:
          SSH_KEY_B64: ${{ secrets.NEXORA_DEPLOY_SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.NEXORA_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.NEXORA_DEPLOY_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.NEXORA_SSH_KNOWN_HOSTS }}
        run: |
          for var in SSH_KEY_B64 SSH_HOST SSH_USER SSH_KNOWN_HOSTS; do
            if [ -z "${!var}" ]; then echo "::error::Missing $var"; exit 1; fi
          done
      - name: Deploy standalone page into NEXORA release directory
        env:
          KEY_B64: ${{ secrets.NEXORA_DEPLOY_SSH_KEY_B64 }}
          HOST: ${{ secrets.NEXORA_DEPLOY_HOST }}
          USER: ${{ secrets.NEXORA_DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.NEXORA_SSH_KNOWN_HOSTS }}
          PORT: ${{ vars.NEXORA_SSH_PORT || '22' }}
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -p $PORT -o StrictHostKeyChecking=yes -o BatchMode=yes"
          ssh $SSH_OPTS "$USER@$HOST" "mkdir -p ~/nexora-frontend/releases/$RELEASE"
          rsync -az --delete -e "ssh -i $HOME/.ssh/id_ed25519 -p $PORT -o StrictHostKeyChecking=yes -o BatchMode=yes" dist/ "$USER@$HOST:nexora-frontend/releases/$RELEASE/"
          # Build the public spot catalog on the Turkey VPS, rather than GitHub
          # runners, which may be blocked by Bybit's regional restrictions.
          ssh $SSH_OPTS "$USER@$HOST" bash -s -- "$RELEASE" <<'REMOTE'
          set -euo pipefail
          release="$1"
          case "$release" in *[!a-f0-9]*|'') exit 1;; esac
          cd "$HOME/nexora-frontend/releases/$release"
          python3 build-tools/build-spot-catalog.py
          python3 build-tools/build-kline-cache.py
          test -s public/spot-markets.json
          mv public/spot-markets.json spot-markets.json
          rm -rf public
          REMOTE
          # Remove only the legacy NEXORA ticker polling job; live prices use WebSockets.
          ssh $SSH_OPTS "$USER@$HOST" bash -s -- <<'REMOTE'
          set -euo pipefail
          if command -v crontab >/dev/null 2>&1; then
            (crontab -l 2>/dev/null || true) | { grep -v '# NEXORA_SPOT_TICKERS' || true; } | crontab -
          fi
          REMOTE
          # Persist token images independently of frontend releases (once per symbol).
          # A fresh release links back to the dedicated NEXORA asset directory.
          ssh $SSH_OPTS "$USER@$HOST" bash -s -- "$RELEASE" <<'REMOTE'
          set -euo pipefail
          release="$1"
          case "$release" in *[!a-f0-9]*|'') exit 1;; esac
          cd "$HOME/nexora-frontend"
          mkdir -p shared/token-icons
          cp -n releases/"$release"/token-icons/*.png shared/token-icons/
          cp releases/"$release"/token-icons/manifest.json shared/token-icons/manifest.json
          rm -rf -- "releases/$release/token-icons"
          ln -s ../../shared/token-icons "releases/$release/token-icons"
          REMOTE
          ssh $SSH_OPTS "$USER@$HOST" "cd ~/nexora-frontend && ln -sfn releases/$RELEASE next && mv -Tf next current"
          # Only after a successful release switch, remove older frontend release
          # directories. Never touch the backend or paths outside this directory.
          ssh $SSH_OPTS "$USER@$HOST" bash -s -- "$RELEASE" <<'REMOTE'
          set -euo pipefail
          release="$1"
          case "$release" in *[!a-f0-9]*|'') exit 1 ;; esac
          cd "$HOME/nexora-frontend"
          test -d releases
          test -f "releases/$release/index.html"
          test "$(readlink current)" = "releases/$release"
          find releases -mindepth 1 -maxdepth 1 -type d ! -name "$release" -exec rm -rf -- {} +
          REMOTE
