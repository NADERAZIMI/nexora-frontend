name: Security audit - TradingChest artifact
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-tradingchest.yml
      - scripts/audit-tradingchest-package.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-third-party-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned tarball without running package scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output audit-temp
          npm pack trading-chest@0.10.0 --ignore-scripts --pack-destination audit-output --json > audit-output/pack-metadata.json
          test -f audit-output/trading-chest-0.10.0.tgz
          npm view trading-chest@0.10.0 dist.integrity dist.shasum --json > audit-output/registry-metadata.json
          sha256sum audit-output/trading-chest-0.10.0.tgz > audit-output/sha256.txt
      - name: Inspect tarball structure and code flags without extracting or executing
        env:
          TARBALL: audit-output/trading-chest-0.10.0.tgz
          AUDIT_REPORT: audit-output/static-report.json
        run: python3 scripts/audit-tradingchest-package.py
      - name: Compare registry SHA-1 and SHA-512 integrity values
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,pathlib
          meta=json.loads(pathlib.Path('audit-output/registry-metadata.json').read_text())
          p=pathlib.Path('audit-output/trading-chest-0.10.0.tgz').read_bytes()
          value=meta.get('dist.integrity') or meta.get('integrity')
          sha1=meta.get('dist.shasum') or meta.get('shasum')
          if not value or not sha1:raise SystemExit('Registry integrity metadata missing')
          algo,expected=value.split('-',1)
          if algo!='sha512':raise SystemExit('Unexpected integrity algorithm')
          actual=base64.b64encode(hashlib.sha512(p).digest()).decode()
          if actual!=expected or hashlib.sha1(p).hexdigest()!=sha1:raise SystemExit('Tarball registry integrity mismatch')
          print('Exact registry SHA-1 and SHA-512 match verified')
          PY
      - name: Dependency metadata vulnerability scan without installing scripts
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          cd audit-temp
          printf '%s\n' '{"name":"isolated-tradingchest-audit","version":"1.0.0","private":true}' > package.json
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit trading-chest@0.10.0 klinecharts@10.1.0 > ../audit-output/lock-generation.log 2>&1
          npm audit --omit=dev --json > ../audit-output/npm-audit.json 2>&1
      - name: Upload audit evidence for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingchest-0_10_0-static-audit
          path: |
            audit-output/static-report.json
            audit-output/registry-metadata.json
            audit-output/pack-metadata.json
            audit-output/sha256.txt
            audit-output/lock-generation.log
            audit-output/npm-audit.json
          if-no-files-found: warn
          retention-days: 14
